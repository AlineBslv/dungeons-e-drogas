name: Production Health Check

on:
  schedule:
    # Executa a cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  healthcheck:
    name: Check Backend Health
    runs-on: ubuntu-latest

    steps:
      - name: Health Check
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend is healthy (HTTP $RESPONSE)"
          else
            echo "❌ Backend is down or unhealthy (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "🚨 Backend Health Check Failed"
          description: "O backend do Dungeons e Drogas não está respondendo!"
          color: 0xff0000
